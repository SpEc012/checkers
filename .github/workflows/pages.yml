name: Publish checkers
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare game entry page
        run: |
          mkdir -p pages
          cat > pages/index.html <<'HTML'
          <!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Across the Board</title><body style="font-family:system-ui;background:#fff5f3;color:#562d3a;text-align:center;padding:15vh 24px"><h1>Across the Board ♡</h1><p>A little checkers date for Dylan & Audrey.</p><a href="https://across-the-board-dylan-audrey.spec0ntop.chatgpt.site">Play local or online →</a></body></html>
          HTML
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
