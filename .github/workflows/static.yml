# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare arcade entry page
        run: |
          mkdir -p pages
          cp public/favicon.svg public/apple-touch-icon.png pages/
          cat > pages/index.html <<'HTML'
          <!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#a52f51"><title>Our Little Arcade</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png"><body style="font-family:system-ui;background:#fff5f3;color:#562d3a;text-align:center;padding:12vh 24px"><img src="favicon.svg" alt="" width="92" height="92" style="border-radius:22px"><h1 style="margin:22px 0 8px">Our Little Arcade ♡</h1><p>Six games, shared rooms, love notes, and a little friendly rivalry.</p><a href="https://across-the-board-dylan-audrey.spec0ntop.chatgpt.site" style="display:inline-block;margin-top:14px;padding:13px 22px;border-radius:14px;background:#ae3155;color:#fff;text-decoration:none">Play together →</a></body></html>
          HTML
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
